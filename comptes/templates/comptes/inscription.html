{% extends "base.html" %}

{% block title %}
Créer un compte — Baol Shop
{% endblock %}

{% block content %}

<style>

.auth-page {
    max-width: 470px;
    margin: 60px auto;
    padding: 20px;
}

.auth-card {
    background: white;
    padding: 35px;
    border: 1px solid #e5e5e5;
    border-radius: 16px;
}

.auth-card h1 {
    margin-top: 0;
}

.auth-card p {
    color: #777;
}

.auth-card label {
    display: block;
    margin: 15px 0 7px;
    font-weight: bold;
}

.auth-card input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
}

.auth-button {
    width: 100%;
    margin-top: 22px;
    padding: 15px;
    border: 0;
    border-radius: 8px;
    background: #111;
    color: white;
    font-weight: bold;
}

.auth-link {
    margin-top: 20px;
    text-align: center;
}

</style>


<div class="auth-page">

    <div class="auth-card">

        <p class="small-title">
            BAOL SHOP
        </p>

        <h1>
            Créer mon compte
        </h1>

        <p>
            Créez votre compte pour suivre facilement vos commandes.
        </p>


        <form method="post">

            {% csrf_token %}


            <label>
                Nom d'utilisateur
            </label>

            <input
                type="text"
                name="username"
                placeholder="Votre nom d'utilisateur"
                required
            >


            <label>
                Adresse email
            </label>

            <input
                type="email"
                name="email"
                placeholder="exemple@email.com"
                required
            >


            <label>
                Mot de passe
            </label>

            <input
                type="password"
                name="password"
                placeholder="Votre mot de passe"
                required
            >


            <label>
                Confirmer le mot de passe
            </label>

            <input
                type="password"
                name="password2"
                placeholder="Confirmez votre mot de passe"
                required
            >


            <button
                type="submit"
                class="auth-button"
            >
                Créer mon compte
            </button>

        </form>


        <div class="auth-link">

            Déjà un compte ?

            <a href="{% url 'connexion' %}">
                Se connecter
            </a>

        </div>

    </div>

</div>

{% endblock %}
