<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion — Baol Shop</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f6f6;
        }

        .box {
            max-width: 450px;
            margin: 90px auto;
            background: white;
            padding: 40px;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 35px;
        }

        .logo span {
            font-weight: 400;
        }

        h1 {
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #111;
            color: white;
            border: 0;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            padding: 12px;
            margin-bottom: 15px;
            background: #f1dddd;
            color: #9b2226;
        }

        .link {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        a {
            color: #111;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        BAOL<span>SHOP</span>
    </div>

    <h1>Connexion</h1>

    {% for message in messages %}
        <div class="message">
            {{ message }}
        </div>
    {% endfor %}

    <form method="post">

        {% csrf_token %}

        <input
            type="text"
            name="username"
            placeholder="Nom d'utilisateur"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Mot de passe"
            required
        >

        <button type="submit">
            SE CONNECTER
        </button>

    </form>

    <div class="link">
        Pas encore de compte ?
        <a href="{% url 'inscription' %}">
            Créer un compte
        </a>
    </div>

</div>

</body>
</html>
